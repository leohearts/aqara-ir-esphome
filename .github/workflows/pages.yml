# Publishes docs/ (the web UI) plus the Clang/LLD WebAssembly build with the Mips backend.
# The toolchain is ~100 MB, so it lives in a release asset instead of git; see toolchain/README.md.
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch toolchain release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download toolchain-clang22-mips --repo ${{ github.repository }} --dir assets
          mkdir -p docs/clang && tar xzf assets/clang-mips-wasm.tar.gz -C docs/clang
          cp assets/sysroot.tar.gz docs/
          cp -r src/irgen/components docs/components
          echo ${{ github.sha }} > docs/version.txt   # the web UI re-downloads files only when this changes
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
