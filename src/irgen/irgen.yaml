esphome:
  name: irgen

host:

external_components:
  - source: github://leohearts/aqara-ir-esphome   # components/ in this repository
    components: [remote_transmitter, remote_receiver, aqara_ir]
  - source: github://ryanh7/esphome-custom-components
    components: [gree_ext]

remote_transmitter:
  id: ir_out
  send_times: 1  # copies per command; raise to 2-3 if the AC misses commands (it beeps once per copy)

remote_receiver:
  id: ir_in

climate:
  - platform: gree_ext
    id: ac
    name: AC
    model: yap0f
    transmitter_id: ir_out
    receiver_id: ir_in        # decode the physical remote (optional)
    supports_horizontal_swing: false

aqara_ir:
  climate_id: ac
  receiver_id: ir_in
